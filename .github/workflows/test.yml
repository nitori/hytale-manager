name: test

# Every push, because work lands on master directly here — a pull-request-only trigger meant
# nothing on master was ever tested. Also called by release.yml, so a tag cannot publish
# something that was never tested.
on:
  push:
    # Branches only. A tag reaches these tests through release.yml, which gates the build on
    # them; triggering here as well would run them twice for every release.
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  # Superseding a push makes its run irrelevant, but never cancel one a release is waiting on.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The `cfg(windows)` branches are written on Linux, so without this they are compiled
      # for the first time by the release build. `aws-lc-sys` compiles C for the target even
      # under clippy, which is why the cross toolchain is needed to only *check*.
      - name: Cross-check the Windows target
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
          cargo clippy --workspace --all-targets --locked \
            --target x86_64-pc-windows-gnu -- -D warnings
