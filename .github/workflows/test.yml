name: test

# Pull requests only: master is protected, so everything reaches it through one. A branch
# with no pull request is someone's work in progress and not worth the minutes. Also called
# by release.yml, so a tag cannot publish something that was never tested.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  # Superseding a push makes its run irrelevant, but never cancel one a release is waiting on.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The `cfg(windows)` branches are written on Linux, so without this they are compiled
      # for the first time by the release build. `aws-lc-sys` compiles C for the target even
      # under clippy, which is why the cross toolchain is needed to only *check*.
      - name: Cross-check the Windows target
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
          cargo clippy --workspace --all-targets --locked \
            --target x86_64-pc-windows-gnu -- -D warnings
