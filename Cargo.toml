[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/nitori/hytale-manager"

[workspace.dependencies]
hy-backup = { path = "crates/hy-backup" }
hy-cli = { path = "crates/hy-cli" }
hy-dist = { path = "crates/hy-dist" }
hy-instance = { path = "crates/hy-instance" }
hy-java = { path = "crates/hy-java" }
hy-run = { path = "crates/hy-run" }

ansi-to-tui = "8.0"
anstream = "1.0"
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
crossterm = "0.29"
etcetera = "0.11"
flate2 = "1"
fs4 = "1.1"
futures-util = "0.3"
indicatif = "0.18"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
owo-colors = { version = "4", features = ["supports-colors"] }
quick-xml = "0.41"
ratatui = "0.30"
# `rustls` rather than native-tls: nothing to link against, so the static musl build needs
# no system OpenSSL. Roots come from the host trust store, which is what makes `hy` work
# behind a MITM proxy and what makes a bare container need `ca-certificates`.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "stream",
  "json",
  "charset",
  "http2",
] }
serde = { version = "1", features = ["derive"] }
semver = "1.0"
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
