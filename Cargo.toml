[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/sani/hytale-manager"

[workspace.dependencies]
hy-backup = { path = "crates/hy-backup" }
hy-cli = { path = "crates/hy-cli" }
hy-dist = { path = "crates/hy-dist" }
hy-instance = { path = "crates/hy-instance" }
hy-java = { path = "crates/hy-java" }
hy-run = { path = "crates/hy-run" }

anstream = "1.0"
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
etcetera = "0.11"
flate2 = "1"
fs4 = "1.1"
futures-util = "0.3"
indicatif = "0.18"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
owo-colors = { version = "4", features = ["supports-colors"] }
# `rustls` + `webpki-roots` rather than native-tls: no system OpenSSL and no dependency on
# the host cert store, which keeps cross-compilation simple. reqwest 0.13 split what 0.12
# called `rustls-tls` into these two features.
quick-xml = "0.41"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "webpki-roots",
  "stream",
  "json",
  "charset",
  "http2",
] }
serde = { version = "1", features = ["derive"] }
semver = "1.0"
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
